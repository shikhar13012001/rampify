    <!-- Structured data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Rampcut",
      "url": "https://rampcut.astralbuild.dev",
      "description": "Browser-based video speed ramping editor with AI slow motion, beat sync, motion blur, and 4K export. No installs. Your footage never leaves your machine.",
      "applicationCategory": "VideoApplication",
      "operatingSystem": "Any modern web browser",
      "offers": [
        {
          "@type": "Offer",
          "name": "Free",
          "price": "0",
          "priceCurrency": "USD"
        },
        {
          "@type": "Offer",
          "name": "Pro",
          "price": "12",
          "priceCurrency": "USD",
          "priceSpecification": {
            "@type": "RecurringChargeSpecification",
            "price": "12",
            "priceCurrency": "USD",
            "billingDuration": "P1M"
          }
        }
      ],
      "featureList": [
        "Speed curve editor with bezier and linear interpolation",
        "AI frame interpolation powered by RIFE neural network",
        "Beat sync with STFT spectral flux detection",
        "Cinematic motion blur on speed transitions",
        "4K export via ffmpeg.wasm",
        "100% local processing — no video uploads"
      ],
      "publisher": {
        "@type": "Organization",
        "name": "Rampcut",
        "url": "https://rampcut.astralbuild.dev"
      }
    }
    </script>

    <!-- Structured data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Do I need to install anything to use Rampcut?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Rampcut runs entirely in your browser using WebAssembly. ffmpeg.wasm handles video encoding in a Web Worker, and AI interpolation runs via ONNX Runtime Web. No downloads, no plugins, no native apps."
          }
        },
        {
          "@type": "Question",
          "name": "Does my video get uploaded to a server?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. All video processing happens locally in your browser. Your footage never leaves your machine. The only server calls are for authentication and subscription management."
          }
        },
        {
          "@type": "Question",
          "name": "What video formats does Rampcut support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can import MP4, WebM, MOV, MKV, AVI, and most other formats ffmpeg can decode. Export is MP4 (H.264) only — up to 1080p on Free, up to 4K on Pro."
          }
        },
        {
          "@type": "Question",
          "name": "How does the AI slow motion work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Rampcut uses RIFE (Real-time Intermediate Flow Estimation), a neural network that generates intermediate frames between existing ones. This creates smooth slow motion without judder. It runs on GPU via WebGL when available, with CPU fallback."
          }
        },
        {
          "@type": "Question",
          "name": "Can I cancel my Rampcut subscription anytime?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, and there's no retention flow or cancellation questionnaire. Open the account menu and choose Manage subscription to reach our billing partner's customer portal, where you confirm the cancellation. Your Pro access continues until the end of your billing period, then you drop to the free plan."
          }
        }
      ]
    }
    </script>

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Rampcut",
      "url": "https://rampcut.astralbuild.dev",
      "logo": "https://rampcut.astralbuild.dev/favicon.svg",
      "description": "Browser-based video speed ramping editor with AI slow motion, beat sync, motion blur, and 4K export. Local-first — no uploads.",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "hello@rampcut.com",
        "contactType": "customer support",
        "areaServed": "Worldwide",
        "availableLanguage": "English"
      }
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async onerror="window.__gisLoadFailed = true"></script>
  </head>
  <body>
    <div id="root">
      <!--
        Pre-hydration fallback content. Crawlers (and users with JS disabled)
        see this before React mounts. Kept in sync with the hero copy in
        src/pages/Landing.tsx. The React tree replaces this on mount.
      -->
      <h1>Make a clip worth watching twice — no upload, ever.</h1>
      <p>
        Rampcut is a browser-based speed ramp editor. Choose a clip already on
        your device, shape its speed with a curve, and preview the result
        instantly. Your footage stays on your machine the whole time.
      </p>
      <noscript>
        Rampcut is a JavaScript application. Please enable JavaScript to use the
        speed ramp editor. Your video is processed locally in your browser and
        never uploaded to a server.
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
